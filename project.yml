# XcodeGen specification. Regenerate the project with: xcodegen generate
# (the generated Tern.xcodeproj is committed so the repo opens in Xcode without extra tools).
name: Tern
options:
  bundleIdPrefix: com.daelyndoughty
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  defaultConfig: Release
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.99.2
  TernCore:
    path: Packages/TernCore
targets:
  Tern:
    type: application
    platform: iOS
    sources:
      - path: Tern
        excludes:
          - "**/*.md"
          - "Resources/vimconfig"
          - "Resources/terminfo"
      - path: Tern/Resources/vimconfig
        type: folder
      - path: Tern/Resources/terminfo
        type: folder
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
      - package: TernCore
        product: TernCore
      - target: TernSupport
        embed: true
        codeSign: true
      - framework: Toolchain/frameworks/ios_system.xcframework
        embed: true
        codeSign: true
    info:
      path: Tern/Info.plist
      properties:
        CFBundleDisplayName: Tern
        CFBundleName: Tern
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIApplicationSupportsIndirectInputEvents: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIViewControllerBasedStatusBarAppearance: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSHumanReadableCopyright: Copyright 2026 Daelyn Doughty. MIT License.
        # Export compliance: Tern uses only standard, published algorithms (OpenSSL and OpenSSH for
        # TLS and SSH), the same declaration a-Shell ships with. See docs/PUBLISHING.md.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.daelyndoughty.tern
            CFBundleURLSchemes: [tern]
    settings:
      base:
        PRODUCT_NAME: Tern
        PRODUCT_BUNDLE_IDENTIFIER: $(TERN_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(TERN_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: Tern/Bridge/Tern-Bridging-Header.h
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        # ios_system looks up callbacks in the app binary with dlsym: keep global symbols.
        DEAD_CODE_STRIPPING: "NO"
        STRIP_STYLE: non-global
        OTHER_LDFLAGS: ["$(inherited)", "-Wl,-export_dynamic"]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ENABLE_PREVIEWS: "YES"
    preBuildScripts:
      - name: Fetch Toolchain
        script: |
          if ! bash "$SRCROOT/scripts/fetch-toolchain.sh" --check >/dev/null 2>&1; then
            bash "$SRCROOT/scripts/fetch-toolchain.sh"
          fi
        basedOnDependencyAnalysis: false
        showEnvVars: false
    postBuildScripts:
      - name: Embed Toolchain
        script: |
          python3 "$SRCROOT/scripts/embed-toolchain.py"
        basedOnDependencyAnalysis: false
        showEnvVars: false
  TernSupport:
    # Launch-time C shims for the toolchain (see Support/TernSupport/TernSupport.c).
    type: framework
    platform: iOS
    sources:
      - path: Support/TernSupport
        headerVisibility: public
    info:
      path: Support/TernSupport/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_NAME: TernSupport
        PRODUCT_BUNDLE_IDENTIFIER: $(TERN_BUNDLE_ID).support
        DEVELOPMENT_TEAM: $(TERN_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        GCC_C_LANGUAGE_STANDARD: gnu11
        CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
  TernTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TernTests
    dependencies:
      - target: Tern
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TERN_BUNDLE_ID).tests
        DEVELOPMENT_TEAM: $(TERN_TEAM_ID)
        GENERATE_INFOPLIST_FILE: "YES"
  TernUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TernUITests
    dependencies:
      - target: Tern
    info:
      path: TernUITests/Info.plist
      properties:
        # Optional settings for the interactive ssh test, passed on the xcodebuild command line:
        #   xcodebuild test ... TERN_UITEST_SSH_HOST=user@host TERN_UITEST_SSH_KEY=/path/to/key
        TernUITestSSHHost: $(TERN_UITEST_SSH_HOST)
        TernUITestSSHKey: $(TERN_UITEST_SSH_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TERN_BUNDLE_ID).uitests
        DEVELOPMENT_TEAM: $(TERN_TEAM_ID)
        TEST_TARGET_NAME: Tern
        TERN_UITEST_SSH_HOST: ""
        TERN_UITEST_SSH_KEY: ""
schemes:
  Tern:
    build:
      targets:
        Tern: all
        TernTests: [test]
        TernUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - TernTests
        - name: TernUITests
          parallelizable: false
    archive:
      config: Release
